<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bảng trong CSS</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        margin: 0;
        padding: 30px;
      }

      .container {
        max-width: 700px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #dfe3eb;
        border-radius: 10px;
        padding: 25px;
      }

      h1 {
        text-align: center;
        color: #1d3557;
        margin-bottom: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      table,
      th,
      td {
        border: 1px solid black;
      }

      th {
        height: 50px;
        text-align: left;
        background-color: #333;
        color: white;
        padding: 15px;
      }

      td {
        height: 80px;
        vertical-align: bottom;
        background-color: #f2f2f2;
        color: #333;
        padding: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Bảng trong CSS</h1>
      <table>
        <tr>
          <th>Họ tên</th>
          <th>Tuổi</th>
          <th>Lớp</th>
        </tr>
        <tr>
          <td>Nguyễn Văn A</td>
          <td>20</td>
          <td>Web</td>
        </tr>
        <tr>
          <td>Trần Thị B</td>
          <td>21</td>
          <td>Web</td>
        </tr>
      </table>
    </div>
  </body>
</html>
