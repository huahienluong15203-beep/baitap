<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh sách sản phẩm</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        margin: 0;
        padding: 30px;
      }

      .container {
        max-width: 700px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 20px;
      }

      h1 {
        text-align: center;
        color: #1d3557;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      th, td {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: left;
      }

      th {
        background: #eaf2ff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Danh sách sản phẩm</h1>
      <table>
        <tr>
          <th>Tên sản phẩm</th>
          <th>Giá</th>
          <th>Số lượng</th>
        </tr>
        <tr>
          <td>Áo thun</td>
          <td>150.000đ</td>
          <td>20</td>
        </tr>
        <tr>
          <td>Quần jean</td>
          <td>320.000đ</td>
          <td>15</td>
        </tr>
        <tr>
          <td>Giày sneaker</td>
          <td>450.000đ</td>
          <td>10</td>
        </tr>
        <tr>
          <td>Túi xách</td>
          <td>280.000đ</td>
          <td>12</td>
        </tr>
      </table>
    </div>
  </body>
</html>
