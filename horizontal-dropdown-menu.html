<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu ngang dropdown</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 40px;
      }

      #menu {
        width: 700px;
        height: 40px;
        border: 1px solid #ccc;
        margin: 30px auto;
        background: #000;
      }

      #menu ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      #menu ul li {
        float: left;
        position: relative;
        width: 120px;
        height: 40px;
        line-height: 40px;
        text-align: center;
        background: #000;
      }

      #menu ul li a {
        display: block;
        width: 120px;
        height: 40px;
        text-decoration: none;
        color: #fff;
      }

      #menu ul li a:hover {
        background: red;
      }

      #menu ul ul {
        position: absolute;
        top: 40px;
        left: 0;
        visibility: hidden;
      }

      #menu ul li:hover > ul {
        visibility: visible;
      }

      #menu ul ul li {
        float: none;
        background: #333;
      }

      #menu ul ul li a:hover {
        background: #f00;
      }
    </style>
  </head>
  <body>
    <div id="menu">
      <ul>
        <li><a href="#">Home</a></li>
        <li>
          <a href="#">News</a>
          <ul>
            <li><a href="#">Phone</a></li>
            <li><a href="#">Laptop</a></li>
            <li><a href="#">Tablet</a></li>
          </ul>
        </li>
        <li>
          <a href="#">Products</a>
          <ul>
            <li><a href="#">Software</a></li>
            <li><a href="#">Hardware</a></li>
          </ul>
        </li>
        <li><a href="#">Contact</a></li>
      </ul>
    </div>
  </body>
</html>
