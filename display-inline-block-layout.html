<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bố cục trang web với display</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        background: #f4f7fb;
      }

      h1 {
        margin-top: 30px;
        margin-bottom: 20px;
        color: #1f2937;
      }

      nav {
        background: #e2e8f0;
        padding: 15px 0;
        margin-bottom: 20px;
      }

      nav a {
        display: inline-block;
        margin: 0 15px;
        text-decoration: none;
        color: #1f2937;
        font-weight: 700;
        padding: 8px 12px;
        border-radius: 6px;
        transition: all 0.2s ease;
      }

      nav a:hover {
        background: #cbd5e1;
      }

      section {
        max-width: 1100px;
        margin: 20px auto;
        padding: 0 10px;
      }

      .box {
        display: inline-block;
        width: 30%;
        min-height: 180px;
        padding: 20px;
        background-color: #bae6fd;
        margin: 10px;
        border-radius: 12px;
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
        vertical-align: top;
        text-align: left;
        color: #0f172a;
        font-weight: 600;
      }

      footer {
        background: #0f172a;
        color: white;
        text-align: center;
        padding: 18px 12px;
      }

      @media (max-width: 700px) {
        .box {
          display: block;
          width: 90%;
          margin: 12px auto;
        }
      }
    </style>
  </head>
  <body>
    <h1>Bố cục trang web với display</h1>

    <nav>
      <a href="#">Trang chủ</a>
      <a href="#">Giới thiệu</a>
      <a href="#">Dịch vụ</a>
      <a href="#">Liên hệ</a>
    </nav>

    <section>
      <div class="box">Cột 1</div>
      <div class="box">Cột 2</div>
      <div class="box">Cột 3</div>
    </section>

    <footer>
      <p>Bản quyền &copy; 2024</p>
    </footer>
  </body>
</html>
