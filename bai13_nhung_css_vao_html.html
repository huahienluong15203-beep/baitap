<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nhúng CSS vào HTML</title>
    <link rel="stylesheet" href="bai13_external_style.css" />
    <style>
      .internal-text {
        color: blue;
      }
    </style>
  </head>
  <body>
    <h1>Nhúng CSS vào HTML</h1>

    <div>
      <h2>Phần 1: Inline Style</h2>
      <p style="color: red;">Đây là đoạn văn được đổi màu bằng inline-style.</p>
    </div>

    <div>
      <h2>Phần 2: Internal Style</h2>
      <p class="internal-text">Đây là đoạn văn được đổi màu bằng internal-style.</p>
    </div>

    <div>
      <h2>Phần 3: External Style</h2>
      <p class="external-text">Đây là đoạn văn được đổi màu bằng external-style.</p>
    </div>
  </body>
</html>
