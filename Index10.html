<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Đăng ký tài khoản</title>
    <style>
      body {
        font-family: "Lucida Grande", "Lucida Sans Unicode", Tahoma, sans-serif;
        padding: 20px;
      }
      form {
        max-width: 500px;
      }
      label {
        display: inline-block;
        width: 120px;
        margin-bottom: 10px;
      }
      input,
      select {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Đăng ký tài khoản</h2>
    <form>
      <label>Họ và tên:</label>
      <input type="text" name="fullname" placeholder="Nhập họ tên" /> <br />

      <label>Email:</label>
      <input type="email" name="email" placeholder="Nhập email" /> <br />

      <label>Mật khẩu:</label>
      <input type="password" name="password" placeholder="Nhập mật khẩu" />
      <br />

      <label>Giới tính:</label>
      <input type="radio" name="gender" value="nam" /> Nam
      <input type="radio" name="gender" value="nu" /> Nữ <br />

      <label>Thành phố:</label>
      <select name="city">
        <option>Hà Nội</option>
        <option>Đà Nẵng</option>
        <option>TP. Hồ Chí Minh</option>
      </select>
      <br />

      <label>Sở thích:</label>
      <input type="checkbox" name="hobby" value="doc-sach" /> Đọc sách
      <input type="checkbox" name="hobby" value="code" /> Lập trình
      <input type="checkbox" name="hobby" value="game" /> Chơi game <br />

      <input type="submit" value="Đăng ký" />
    </form>
  </body>
</html>
