<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu dọc dropdown</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        margin: 0;
        padding: 40px;
      }

      #menu {
        width: 220px;
        margin: 40px auto;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }

      #menu ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      #menu li {
        position: relative;
        width: 100%;
        height: 40px;
        padding: 0 20px;
        background-color: #111827;
        line-height: 40px;
        cursor: pointer;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      #menu li:hover {
        background-color: #374151;
      }

      #menu a {
        text-decoration: none;
        color: white;
        display: block;
        width: 100%;
        height: 100%;
      }

      #menu ul ul {
        position: absolute;
        top: 0;
        left: 180px;
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.2s ease;
        width: 180px;
      }

      #menu li:hover > ul {
        visibility: visible;
        opacity: 1;
      }

      #menu ul ul li {
        background-color: #1f2937;
      }

      #menu ul ul li:hover {
        background-color: #4b5563;
      }
    </style>
  </head>
  <body>
    <div id="menu">
      <ul>
        <li><a href="#">Trang chủ</a></li>
        <li>
          <a href="#">Sản phẩm</a>
          <ul>
            <li><a href="#">Điện thoại</a></li>
            <li><a href="#">Laptop</a></li>
            <li><a href="#">Phụ kiện</a></li>
          </ul>
        </li>
        <li>
          <a href="#">Dịch vụ</a>
          <ul>
            <li><a href="#">Thiết kế web</a></li>
            <li><a href="#">Marketing</a></li>
            <li><a href="#">Hỗ trợ</a></li>
          </ul>
        </li>
        <li><a href="#">Liên hệ</a></li>
      </ul>
    </div>
  </body>
</html>
