<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lịch họp công ty</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f6f8fb;
        margin: 0;
        padding: 30px;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #dfe3ea;
        border-radius: 10px;
        padding: 20px;
      }

      h1 {
        text-align: center;
        color: #1f3b5b;
        margin-bottom: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        border: 1px solid #cfd8e3;
        padding: 12px 10px;
        text-align: center;
      }

      th {
        background: #eaf2ff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Lịch họp công ty</h1>
      <table>
        <tr>
          <th>Ngày</th>
          <th>Giờ</th>
          <th>Nội dung cuộc họp</th>
        </tr>

        <tr>
          <td rowspan="2">01/10/2026</td>
          <td>08:30</td>
          <td>Họp định hướng công việc tuần</td>
        </tr>
        <tr>
          <td>14:00</td>
          <td>Phân tích tiến độ dự án</td>
        </tr>

        <tr>
          <td>02/10/2026</td>
          <td colspan="2">Nghỉ làm, không có cuộc họp</td>
        </tr>

        <tr>
          <td rowspan="2">03/10/2026</td>
          <td>09:00</td>
          <td>Họp đánh giá hiệu suất</td>
        </tr>
        <tr>
          <td>15:30</td>
          <td>Họp báo cáo khách hàng</td>
        </tr>
      </table>
    </div>
  </body>
</html>
